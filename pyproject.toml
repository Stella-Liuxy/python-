[project]
name = "cursorlab-desktop"
version = "1.0.0"
description = "Python desktop coding agent for the classroom"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "websockets==15.0.1",
  "pywebview==5.4",
  "pythonnet==3.2.1; sys_platform == 'win32'",
  "pydantic==2.14.3",
  "starlette==0.46.2",
]

[project.optional-dependencies]
build = ["pyinstaller==6.12.0", "pyinstaller-hooks-contrib==2026.9"]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "server"]
